[package]
name = "mihome-api"
version = "0.1.0"
edition = "2021"
description = "MiHome cloud protocol + MiHomeService"

[lib]
name = "mihome_api"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies", "gzip", "deflate"] }
dirs = "6"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
rand = "0.9"
chrono = "0.4"
tracing = "0.1"
