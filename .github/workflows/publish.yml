name: "publish"

on:
    workflow_dispatch:
        inputs:
            full_install:
                description: "本版本改动了 DLL / resources，跳过 exe 差量包，让客户端下载完整安装包"
                type: boolean
                default: false
            delta_base:
                description: "差量包可安全套用的最低已安装版本（不带 v，如 1.6.0）；低于它的客户端改走完整安装包"
                type: string
                default: ""
    push:
        tags:
            - "v*"
        # branches:
        #     - release

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
    publish-tauri:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    # - platform: 'macos-latest' # for Arm based macs (M1 and above).
                    #   args: '--target aarch64-apple-darwin'
                    # - platform: 'macos-latest' # for Intel based macs.
                    #   args: '--target x86_64-apple-darwin'
                    # - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
                    #   args: ''
                    - platform: "windows-latest"
                      args: ""

        runs-on: ${{ matrix.platform }}
        env:
            OPENCV_VERSION: "4.9.0"
            OPENCV_DIR: C:\opencv\build
            OPENCV_INCLUDE_PATHS: C:\opencv\build\include
            OPENCV_LINK_LIBS: opencv_world490
            OPENCV_LINK_PATHS: C:\opencv\build\x64\vc16\lib
            LIBCLANG_PATH: C:\Program Files\LLVM\bin
            OPENCV_BIN_PATHS: C:\opencv\build\x64\vc16\bin
        steps:
            - name: Require release tag
              shell: pwsh
              env:
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  # tagName / release 查询 / 资产上传都以 github.ref_name 为准；分支或非 v* tag 会发到错误的版本上
                  if ($env:REF_TYPE -ne "tag" -or $env:REF_NAME -notlike "v*") {
                      throw "publish 只能从 tag 触发；手动运行时请在 Run workflow 里选择对应的 v* tag（当前: $env:REF_NAME）"
                  }

            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: setup node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*

            - uses: pnpm/action-setup@v5
              name: Install pnpm

            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
              # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
              # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

            - name: Set up OpenCV
              run: |
                  $version = "${{ env.OPENCV_VERSION }}"
                  $url = "https://github.com/opencv/opencv/releases/download/$version/opencv-$version-windows.exe"
                  Invoke-WebRequest -Uri $url -OutFile "opencv.exe"
                  7z x opencv.exe -oC:\ -y
                  Remove-Item opencv.exe
                  "C:\opencv\build\x64\vc16\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Install LLVM
              run: choco install llvm -y

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./apps/web/src-tauri -> target"

            - name: install frontend dependencies
              run: pnpm install # change this to npm, pnpm or bun depending on which one you use.

            - name: Get previous tag
              id: previous_tag
              shell: pwsh
              run: |
                  $tags = git tag --sort=-creatordate | Where-Object { $_ -like "v*" }
                  if ($tags.Count -gt 1) {
                      $previousTag = $tags[1]
                      echo "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT
                  } else {
                      echo "previous_tag=" >> $env:GITHUB_OUTPUT
                  }

            - name: Generate commit diff
              id: commit_diff
              shell: pwsh
              run: |
                  $prevVersion = "${{ steps.previous_tag.outputs.previous_tag }}"
                  $newVersion = "${{ github.ref_name }}"
                  $vernov = $newVersion.Substring(1)
                  echo "version=$vernov" >> $env:GITHUB_OUTPUT
                  if (-not [string]::IsNullOrEmpty($prevVersion)) {
                      $diffLines = git log "$prevVersion...$newVersion" --oneline
                      $diff = New-Object System.Collections.ArrayList
                      foreach ($line in $diffLines) {
                          # 移除开头的提交哈希（支持全小写/混合大小写哈希）
                          $commitMessage = $line -replace '^[a-fA-F0-9]+\s+', ''
                          # 过滤空提交信息
                          if (-not [string]::IsNullOrWhiteSpace($commitMessage)) {
                              [void]$diff.Add("- $commitMessage")
                          }
                      }
                      # 处理无提交记录的情况
                      if ($diff.Count -eq 0) {
                          $diffBody = "## 本次更新内容 ($prevVersion → $newVersion)`n`n- 无提交记录`n`n"
                      } else {
                          $diffBody = "## 本次更新内容 ($prevVersion → $newVersion)`n`n$($diff -join "`n`n")`n`n"
                      }
                      @"
                  commit_diff<<EOF
                  $diffBody
                  EOF
                  "@ | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                  } else {
                      echo "commit_diff=" >> $env:GITHUB_OUTPUT
                  }

            - name: Resolve update mode
              id: update_mode
              shell: pwsh
              env:
                  FULL_INSTALL: ${{ inputs.full_install }}
                  DELTA_BASE: ${{ inputs.delta_base }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  $fullInstall = $env:FULL_INSTALL -eq "true"
                  # 跳过整包版本的客户端无法直接套用 exe 差量：feed 里用 delta_base 标出最低基线
                  $deltaBase = "$env:DELTA_BASE".Trim().TrimStart("v")
                  if ($deltaBase -and $deltaBase -notmatch '^\d+\.\d+\.\d+$') {
                      throw "delta_base 必须是不带 v 的 semver，如 1.6.0（当前: $deltaBase）"
                  }
                  echo "delta_base=$deltaBase" >> $env:GITHUB_OUTPUT
                  if ($fullInstall) {
                      echo "full_install=true" >> $env:GITHUB_OUTPUT
                      echo "delta_line=> 本版本改动了 DLL / resources，需下载完整安装包更新。" >> $env:GITHUB_OUTPUT
                  } else {
                      echo "full_install=false" >> $env:GITHUB_OUTPUT
                      echo "delta_line=> 差量更新包（仅 exe）: [dna-builder-x64.exe.zip](https://github.com/pa001024/dna-builder/releases/download/$env:TAG_NAME/dna-builder-x64.exe.zip)" >> $env:GITHUB_OUTPUT
                  }

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  tagName: ${{ github.ref_name }} # the action automatically replaces \_\_VERSION\_\_ with the app version.
                  releaseName: "Duet Night Abyss Builder v__VERSION__"
                  releaseBody: "${{ steps.commit_diff.outputs.commit_diff }}

                      **Full Changelog**: ${{ steps.previous_tag.outputs.previous_tag && format('https://github.com/pa001024/dna-builder/compare/{0}...{1}', steps.previous_tag.outputs.previous_tag, github.ref_name) || format('https://github.com/pa001024/dna-builder/commits/{0}', github.ref_name) }}

                      > [!TIP]

                      > Github 请在下方下载

                      > 夸克网盘链接：https://pan.quark.cn/s/1419bbc8aa2d

                      > 直接下载: [${{ github.ref_name }}](https://cdn.dna-builder.cn/msi/DNA%20Builder_${{ steps.commit_diff.outputs.version }}_x64_zh-CN.msi)

                      ${{ steps.update_mode.outputs.delta_line }}
                      "
                  releaseDraft: false
                  prerelease: false
                  projectPath: apps/web
                  args: ${{ matrix.args }}

            - name: Package exe delta update
              if: success() && github.event_name != 'pull_request'
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.commit_diff.outputs.version }}
                  RELEASE_NOTES: ${{ steps.commit_diff.outputs.commit_diff }}
                  TAG_NAME: ${{ github.ref_name }}
                  FULL_INSTALL: ${{ steps.update_mode.outputs.full_install }}
                  DELTA_BASE: ${{ steps.update_mode.outputs.delta_base }}
              run: |
                  $feed = [ordered]@{
                      version = $env:VERSION
                      notes = $env:RELEASE_NOTES
                      pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                  }

                  # release 里的 MSI：整包版本必填；差量版本在设置 delta_base 时也必须有，
                  # 供跳过整包版本的客户端回退
                  $installerUrl = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG_NAME" `
                      --jq '[.assets[].browser_download_url | select(endswith(".msi"))][0]'
                  if (-not $installerUrl -or $installerUrl -eq "null") {
                      $installerUrl = $null
                  } else {
                      $installerUrl = $installerUrl.Trim()
                  }

                  if ($env:FULL_INSTALL -eq "true") {
                      # DLL / resources 有变化：不发布 exe 差量包，feed 直接指向 release 里的 MSI
                      if (-not $installerUrl) { throw "release 中找不到 MSI 资产" }
                      $feed.requires_full_install = $true
                      $feed.installer_url = $installerUrl
                  } else {
                      $exe = "apps/web/src-tauri/target/release/dna-builder.exe"
                      if (-not (Test-Path $exe)) { throw "exe 不存在: $exe" }

                      $zipName = "dna-builder-x64.exe.zip"
                      $zipPath = Join-Path (Get-Location) $zipName
                      Remove-Item $zipPath -ErrorAction SilentlyContinue

                      # 只把 exe 放进包根目录，DLL 等固定文件留在安装目录不参与更新
                      Push-Location (Split-Path $exe)
                      try {
                          7z a -tzip -mx=9 $zipPath "dna-builder.exe" | Out-Null
                          if ($LASTEXITCODE -ne 0) { throw "7z 打包失败" }
                      } finally {
                          Pop-Location
                      }

                      $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
                      $size = (Get-Item $zipPath).Length
                      $url = "https://github.com/pa001024/dna-builder/releases/download/$env:TAG_NAME/$zipName"

                      $feed.platforms = [ordered]@{
                          "windows-x86_64-exe" = [ordered]@{
                              url = $url
                              size = $size
                              sha256 = $hash
                          }
                      }
                      if ($installerUrl) { $feed.installer_url = $installerUrl }
                      if ($env:DELTA_BASE) {
                          if (-not $installerUrl) { throw "设置 delta_base 时 release 中必须有 MSI 资产作为完整安装回退" }
                          $feed.delta_base = $env:DELTA_BASE
                      }

                      gh release upload $env:TAG_NAME $zipName --repo $env:GITHUB_REPOSITORY --clobber
                      Write-Host "exe 差量包: $([math]::Round($size / 1MB, 2)) MB, sha256=$hash"
                  }

                  $feed | ConvertTo-Json -Depth 6 | Out-File -FilePath "update.json" -Encoding utf8
                  gh release upload $env:TAG_NAME update.json --repo $env:GITHUB_REPOSITORY --clobber

            - name: Resolve Chrome for card rendering
              id: chrome
              if: success() && github.event_name != 'pull_request'
              shell: pwsh
              run: |
                  # 托管 runner 预装 Chrome/Edge，但路径不进 PATH；显式定位后写进环境变量，避免截图阶段才报找不到
                  $candidates = @(
                      "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
                      "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
                      "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
                      "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
                  ) | Where-Object { Test-Path $_ }

                  if (-not $candidates) {
                      # 自托管 runner 上可能装在别处，交给脚本自己的查找逻辑
                      Write-Host "::warning::未在默认路径找到 Chrome/Edge，交给脚本自行查找"
                      exit 0
                  }

                  "CHROME_PATH=$($candidates[0])" >> $env:GITHUB_ENV
                  Write-Host "浏览器: $($candidates[0])"

            - name: Publish update dynamic to Bilibili
              id: bili_dynamic
              if: success() && github.event_name != 'pull_request'
              continue-on-error: true
              timeout-minutes: 10
              shell: pwsh
              env:
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                  DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
                  DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
                  BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
                  BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
                  BILI_JCT: ${{ secrets.BILI_JCT }}
                  BILI_BUVID3: ${{ secrets.BILI_BUVID3 }}
                  BILI_DEDEUSERID: ${{ secrets.BILI_DEDEUSERID }}
                  TAG_NAME: ${{ github.ref_name }}
                  PREVIOUS_TAG: ${{ steps.previous_tag.outputs.previous_tag }}
                  DELTA_LINE: ${{ steps.update_mode.outputs.delta_line }}
                  INSTALLER_URL: https://cdn.dna-builder.cn/msi/DNA%20Builder_${{ steps.commit_diff.outputs.version }}_x64_zh-CN.msi
              run: |
                  # 用一个数组传参，避免上一版本为空时 PowerShell 把空字符串吞掉
                  $scriptArgs = @("tools/bili-dynamic/index.ts", "--tag", $env:TAG_NAME, "--repo", $env:GITHUB_REPOSITORY)
                  if ($env:PREVIOUS_TAG) { $scriptArgs += @("--previous", $env:PREVIOUS_TAG) }
                  node @scriptArgs

            - name: Update release notes from agent
              # agent 没产出 markdown 时脚本不会输出 release_notes_path，这一步直接跳过，保留原版正文
              if: success() && github.event_name != 'pull_request' && steps.bili_dynamic.outputs.release_notes_path
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.ref_name }}
                  NOTES_PATH: ${{ steps.bili_dynamic.outputs.release_notes_path }}
              run: |
                  gh release edit $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --notes-file $env:NOTES_PATH

            - name: Add summary
              if: success() && github.event_name != 'pull_request'
              shell: pwsh
              env:
                  # continue-on-error 的步骤失败/超时时 release 仍然成功，这里要如实标注动态是否发出
                  BILI_OUTCOME: ${{ steps.bili_dynamic.outcome }}
                  DYN_STATUS: ${{ steps.bili_dynamic.outputs.dyn_status }}
                  DYN_URL: ${{ steps.bili_dynamic.outputs.dyn_url }}
                  DYN_AUTHOR: ${{ steps.bili_dynamic.outputs.dyn_author }}
                  DYN_REASON: ${{ steps.bili_dynamic.outputs.dyn_reason }}
              run: |
                  $summary = "
                  > [!TIP]
                  > 发布成功
                  > [下载最新的稳定版本](https://github.com/pa001024/dna-builder/releases/latest/)
                  "
                  if ($env:DYN_STATUS -eq "published" -and $env:DYN_URL) {
                      $author = if ($env:DYN_AUTHOR) { "（$env:DYN_AUTHOR）" } else { "" }
                      $summary += "`n> B 站动态$author：[查看]($env:DYN_URL)`n"
                  } elseif ($env:BILI_OUTCOME -eq "success" -and $env:DYN_STATUS -eq "skipped") {
                      $reason = if ($env:DYN_REASON) { "：$env:DYN_REASON" } else { "" }
                      $summary += "`n> [!WARNING]`n> B 站动态已跳过$reason`n"
                  } elseif ($env:BILI_OUTCOME -ne "success") {
                      $summary += "`n> [!WARNING]`n> B 站动态未发布（步骤结果: $env:BILI_OUTCOME），详见该步骤日志`n"
                  }

                  echo $summary >> $Env:GITHUB_STEP_SUMMARY
