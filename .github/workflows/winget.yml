name: Publish to WinGet
on:
    workflow_dispatch:
        inputs:
            version:
                description: "版本号（不带v前缀）"
                required: true
                type: string
jobs:
    publish:
        runs-on: windows-latest
        steps:
            # fork 落后太多时 komac sync-fork 会 422
            # (Sorry, this diff is taking too long to generate)，
            # 先用 --force 硬重置到上游 HEAD（不走 diff，比对再大也能同步），
            # 之后 komac 的 sync-fork 就会变成 no-op 直接成功。
            - name: Sync winget-pkgs fork
              env:
                  GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
              run: gh repo sync ${{ github.repository_owner }}/winget-pkgs --force
            - uses: vedantmgoyal9/winget-releaser@main
              with:
                  identifier: pa001024.dna-builder
                  release-tag: v${{ inputs.version }}
                  version: ${{ inputs.version }}
                  installers-regex: ".*\\.msi$"
                  max-versions-to-keep: 5 # keep only latest 5 versions
                  token: ${{ secrets.WINGET_TOKEN }}
